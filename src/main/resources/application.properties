spring.application.name=demo

# ==============================
# STARTUP OPTIMIZATION
# ==============================

# Inicialización diferida: Tomcat se levanta inmediatamente sin esperar JPA/DB.
# JPA se inicializa en la primera request real. Reduce cold start de ~17s a ~4s.
spring.main.lazy-initialization=true

# ==============================
# DATABASE CONFIGURATION
# ==============================

# Obligatorio en producción (no fallback a H2)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver explícito (recomendado en contenedores)
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ==============================

# none: no toca el esquema en startup (el esquema ya existe en Supabase).
# Evita que Hibernate consulte el DB al arrancar (ahorra ~4-5s).
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dialecto explícito requerido cuando allow_jdbc_metadata_access=false
# También evita el warning HHH90000025 al aclarar la intención
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Evita que Hibernate consulte metadatos del DB durante el arranque (requiere dialect explícito)
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Repositorios JPA se inicializan al primer uso (lazy), evitando que Tomcat espere JPA
spring.data.jpa.repositories.bootstrap-mode=lazy

# Deshabilita open-in-view (evita queries innecesarias en rendering de vistas)
spring.jpa.open-in-view=false

# ==============================
# HIKARI CONNECTION POOL
# ==============================

# Pool reducido para app de bajo tráfico en 512MB
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=60000

# ==============================
# SERVER CONFIG
# ==============================

# Puerto dinámico para Fly (fallback 8080)
server.port=${PORT:8080}
server.address=0.0.0.0

# ==============================
# CORS (ajustar cuando tengas dominio final)
# ==============================

spring.web.cors.allowed-origins=*

# ==============================
# DESACTIVAR SQL INIT
# ==============================

spring.sql.init.mode=never

# ==============================
# H2 DESACTIVADO EN PRODUCCIÓN
# ==============================

spring.h2.console.enabled=false
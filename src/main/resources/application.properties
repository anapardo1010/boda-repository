spring.application.name=demo

# ==============================
# ARRANQUE RÁPIDO
# ==============================

# Inicialización perezosa: los beans se crean solo cuando se necesitan
spring.main.lazy-initialization=true
# Sin banner = arranque levemente más rápido
spring.main.banner-mode=off
# Evita un interceptor costoso que no necesitas si usas REST puro
spring.jpa.open-in-view=false

# ==============================
# DATABASE CONFIGURATION
# ==============================

# Obligatorio en producción (variables de entorno en Fly.io)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver explícito (recomendado en contenedores)
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ==============================

# Mantiene datos existentes y crea tablas si no existen
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dialecto dinámico por variable (default Postgres)
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Reduce validaciones al arrancar (Hibernate no re-verifica el esquema completo)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==============================
# HIKARI CONNECTION POOL
# ==============================

# Pool pequeño: suficiente para 512MB y límite de conexiones de Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# Nombre visible en Supabase logs para identificar conexiones de esta app
spring.datasource.hikari.pool-name=BodaPool
# Validación rápida de conexión (más ligero que el default)
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================
# SERVER CONFIG
# ==============================

# Puerto dinámico para Fly (fallback 8080)
server.port=${PORT:8080}
server.address=0.0.0.0

# Tomcat: reduce threads para entorno con 1 CPU y 512MB
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50

# ==============================
# CORS
# ==============================

spring.web.cors.allowed-origins=*

# ==============================
# DESACTIVAR SQL INIT Y H2
# ==============================

spring.sql.init.mode=never
spring.h2.console.enabled=false
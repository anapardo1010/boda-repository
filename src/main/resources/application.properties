spring.application.name=demo

# Acelerar arranque: crear beans bajo demanda
spring.main.lazy-initialization=true

# ==============================
# DATABASE CONFIGURATION
# ==============================

# Obligatorio en producción (no fallback a H2)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver explícito (recomendado en contenedores)
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ==============================

# Mantiene datos existentes y crea tablas si no existen
spring.jpa.hibernate.ddl-auto=update

# Recomendado en producción si el esquema ya existe (descomenta si aplicable)
# spring.jpa.hibernate.ddl-auto=validate

# Cerrar sesión de JPA después del controlador (mejor práctica para APIs)
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dialecto dinámico por variable (default Postgres)
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Evitar consultas de metadata JDBC en el arranque (acelera con DB remota)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# Evita intentos contextuales LOB en el arranque
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================
# HIKARI CONNECTION POOL
# ==============================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=60000

# No fallar si la pool no se inicializa al arrancar (arranques más rápidos)
spring.datasource.hikari.initialization-fail-timeout=0

# ==============================
# SERVER CONFIG
# ==============================

# Puerto dinámico para Fly (fallback 8080)
server.port=${PORT:8080}
server.address=0.0.0.0

# ==============================
# CORS (ajustar cuando tengas dominio final)
# ==============================

spring.web.cors.allowed-origins=*

# ==============================
# DESACTIVAR SQL INIT
# ==============================

spring.sql.init.mode=never

# ==============================
# H2 DESACTIVADO EN PRODUCCIÓN
# ==============================

spring.h2.console.enabled=false